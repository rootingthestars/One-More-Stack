<!doctype html>
<html lang="en">
<head>
<!-- One More Stack · Chinese rice-sheaf rick / guqin-inspired calm edition -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f1ecdf">
<meta name="description" content="One More Stack — a quiet precision-stacking game inspired by Chinese rice-sheaf ricks, ink-and-celadon landscape art and restrained guqin-like music.">
<title>One More Stack</title>
<style>
:root{color-scheme:light;--paper:#f1ecdf;--ink:#39443e;--muted:#7d8577;--straw:#d9ad5b;--green:#647d6b;--green-dark:#3e554b;--line:#d8d4c5}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:"Avenir Next",Avenir,ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif}
body{overscroll-behavior-y:none;overflow-x:hidden}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible{outline:2px solid #60744c;outline-offset:3px}
.app{width:min(1120px,100%);min-height:100svh;margin:0 auto;padding:12px clamp(13px,2.5vw,30px) 8px;display:flex;flex-direction:column}
.site-header{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:38px;margin:0 0 1px}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.brand-mark{width:39px;height:34px;display:grid;place-items:center;flex:none;overflow:visible}
.brand-mark svg{display:block;width:42px;height:36px}
.brand-name{font:500 17px/1 Georgia,"Times New Roman",serif;letter-spacing:-.035em;color:#39443e;display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.brand-chinese{font:400 10px/1.1 "Songti SC","Noto Serif CJK SC","STSong",serif;letter-spacing:.08em;color:#a65e50}
.header-actions{display:flex;align-items:center;gap:0}
.sound-toggle{width:36px;height:36px;padding:7px;display:grid;place-items:center;border:0;border-radius:50%;background:transparent;color:#71765e}
.sound-toggle:hover,.sound-toggle[aria-pressed="true"]{background:rgba(113,131,93,.10);color:#465b3d}
.sound-toggle svg{width:20px;height:20px;display:block}
.sound-toggle[aria-pressed="false"] .sound-waves{display:none}
.sound-toggle[aria-pressed="true"] .sound-slash{display:none}
.field-panel{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;border:0;border-radius:0;background:transparent;overflow:visible}
.stage{flex:1;height:auto;min-height:320px;max-height:none;position:relative;isolation:isolate;overflow:hidden;background:#f2efdf}
canvas#game{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:manipulation;outline:none}
.hud{position:absolute;z-index:2;left:18px;right:18px;top:15px;display:flex;align-items:flex-start;justify-content:center;gap:0;pointer-events:none;transition:opacity .25s ease}
.current-score{font:400 24px/1 Georgia,"Times New Roman",serif;letter-spacing:-.04em;color:rgba(63,66,49,.79);font-variant-numeric:tabular-nums;text-align:center;text-shadow:0 1px 0 rgba(255,255,255,.25)}
.hud-right{position:absolute;right:0;top:2px}
.best-display{font:400 10px/1.25 system-ui,sans-serif;letter-spacing:.035em;color:rgba(63,66,49,.6);font-variant-numeric:tabular-nums}
.best-display span{font-size:9px;letter-spacing:.09em;text-transform:uppercase;margin-right:3px}
.best-display b{font-weight:600}
.screen-cover{position:absolute;z-index:5;inset:0;display:flex;align-items:center;justify-content:center;padding:12px;background:rgba(243,240,229,.10)}
.cover-card{width:min(390px,100%);padding:12px 10px;text-align:center;border:0;border-radius:0;background:transparent;box-shadow:none}
.intro-card{transform:translateY(-2px)}
.button-row{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap}
.btn{min-height:38px;padding:8px 12px;border:0;border-radius:0;background:transparent;color:#536747;font-size:10px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;box-shadow:none;transition:color .18s ease,opacity .18s ease}
.btn:hover:not(:disabled){background:transparent;color:#303e2b;opacity:.72}
.btn:active:not(:disabled){opacity:.55}
.btn.primary,.btn.primary:hover:not(:disabled){min-width:0;padding:8px 13px;border:0;background:transparent;color:#43573a}
.btn.secondary{background:transparent;color:#777a61}
.btn:disabled{opacity:.35;cursor:not-allowed}
.below-bar{min-height:30px;display:flex;align-items:center;justify-content:flex-end;padding:2px 0 0;transition:opacity .25s ease}
.notebook-link{width:32px;height:30px;padding:6px;display:grid;place-items:center;border:0;border-radius:50%;background:transparent;color:#85866d}
.notebook-link:hover{background:rgba(114,131,93,.10)}
.notebook-link svg{width:17px;height:17px;display:block}
#notesCount{display:none!important}
.toast{position:absolute;z-index:4;left:50%;bottom:12px;transform:translate(-50%,10px);width:max-content;max-width:calc(100% - 28px);padding:8px 12px;background:rgba(58,64,47,.91);border-radius:3px;color:#fff9e6;font-size:10px;line-height:1.4;letter-spacing:.015em;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease}
.toast.visible{opacity:1;transform:translate(-50%,0)}
.screen-cover#result{align-items:flex-start;padding:clamp(24px,5.5svh,52px) 12px 12px;background:linear-gradient(to bottom,rgba(243,240,229,.97) 0%,rgba(243,240,229,.86) 23%,rgba(243,240,229,.32) 39%,rgba(243,240,229,0) 53%)}
.result-card{width:min(390px,100%);padding:12px}
.result-score{margin:3px auto 12px;color:#3e4934;font:400 clamp(44px,8vw,59px)/1 Georgia,"Times New Roman",serif;letter-spacing:-.055em;font-variant-numeric:tabular-nums}
.result-card .button-row{gap:16px}
#againBtn{font-size:10px}
#shareBtn{width:34px;height:34px;min-height:34px;display:grid;place-items:center;padding:7px;border-radius:50%;background:rgba(114,131,93,.10);color:#667653}
#shareBtn svg{width:17px;height:17px;display:block}
body.is-menu .hud,body.is-result .hud{visibility:hidden;opacity:0;pointer-events:none}
body.is-menu .below-bar,body.is-result .below-bar{display:none!important}
.overlay-panel{position:fixed;z-index:20;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(243,240,229,.91);backdrop-filter:blur(5px)}
.modal{width:min(540px,100%);max-height:min(84svh,760px);overflow:auto;padding:6px 3px;background:transparent;border:0;border-radius:0;box-shadow:none}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid #ddd8c7}
.modal h2{margin:0;color:#444938;font:400 27px/1.1 Georgia,"Times New Roman",serif;letter-spacing:-.04em}
.modal-intro,.modal-bottom{display:none!important}
.close-btn{width:34px;height:34px;border:0;border-radius:50%;background:transparent;color:#777d62;font-size:23px}
.note-list{display:grid;gap:0}
.note-entry{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;padding:15px 2px;border:0;border-bottom:1px solid #e3dece;border-radius:0;background:transparent}
.note-number{width:20px;color:#919576;font:400 10px/1.5 system-ui,sans-serif}
.note-entry h3{margin:0 0 5px;color:#4c5240;font:500 13px/1.3 Georgia,"Times New Roman",serif}
.note-entry p{margin:0;color:#777763;font-size:11px;line-height:1.6}
.note-source{display:block;margin-top:7px;color:#999680;font-size:9px}
.note-source a{color:#627550}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(min-width:760px){.app{padding-top:16px}.stage{min-height:420px}}
@media(max-width:540px){.app{padding:9px 12px 6px}.site-header{min-height:34px}.brand-mark{width:35px;height:31px}.brand-mark svg{width:39px;height:33px}.brand-name{font-size:16px;gap:6px}.brand-chinese{font-size:9px}.stage{min-height:320px}.hud{left:12px;right:12px;top:13px}.current-score{font-size:21px}.best-display{font-size:9px}.below-bar{min-height:25px;padding-top:1px}.btn{font-size:10px}.result-score{font-size:48px}.modal{padding:3px 0}}
@media(max-height:650px) and (max-width:600px){.app{padding-top:6px}.stage{min-height:280px}.below-bar{min-height:20px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}

/* One More Stack: only the number and two actions remain at the end of a run. */
.result-card{padding:10px 12px}
.result-card .result-score{margin:0 auto 3px;font-size:clamp(48px,9vw,66px);color:#414334}
.results-label{margin:0 auto 19px;color:#85836f;font-size:10px;letter-spacing:.11em;text-transform:uppercase}
.result-card .button-row{gap:20px}
#againBtn{font-size:10px;letter-spacing:.12em}
#shareBtn{background:transparent}
.below-bar{justify-content:flex-end}
@media(max-width:540px){.result-card .result-score{font-size:52px}.results-label{margin-bottom:14px}}
</style>
</head>

    { id:'cut', title:'A rick of rice sheaves', body:'The Qing dynasty edition of Yuzhi Gengzhi Tu (Imperially Commissioned Illustrations of Agriculture and Sericulture), printed in 1696, documents rice cultivation and related work, including stacking sheaves in a rick. This game takes that historical image as inspiration; its tidy horizontal courses are a playable interpretation, not a reconstruction of one exact regional method.', source:'British Museum · Yuzhi gengzhi tu, 1696', url:'https://www.britishmuseum.org/collection/object/A_1949-0709-0-1' },

    }else if(canLeft){state.mover.left=leftCandidate;state.mover.direction=1;}

    const right=Math.min(d.left+d.width,top.left+top.width);
    const overlap=Math.max(0,right-left);
    const ratio=overlap/Math.max(1,d.width);
    const targetY=currentTopY()-state.baleH;

    [[24,5,-24],[27,9,-23],[37,5,16],[40,10,26],[43,8,30]].forEach(([gx,gy,a])=>{c.fillStyle='#c59a4e';c.strokeStyle='#8a622f';c.lineWidth=.3;c.beginPath();c.ellipse(gx,gy,1.25,2.2,a*Math.PI/180,0,Math.PI*2);c.fill();c.stroke();});
    c.restore();
  }

  function tick(now) {
    const dt=state.elapsed ? Math.min(.04,Math.max(0,(now-state.elapsed)/1000)) : 0;
    state.elapsed=now;
    state.cloudOffset += dt*(reducedMotion?1:7);
    if(state.phase==='playing'){
      state.mover.left += state.mover.direction * state.mover.speed * dt;
      const min=9, max=Math.max(min,state.width-state.mover.width-9);
      if(state.mover.left>=max){state.mover.left=max;state.mover.direction=-1;}
      if(state.mover.left<=min){state.mover.left=min;state.mover.direction=1;}
    } else if(state.phase==='dropping' && state.drop){
      state.drop.elapsed += dt;
      if(state.drop.elapsed>=state.drop.duration) finishDrop();
    }
    for(let i=state.particles.length-1;i>=0;i--){const p=state.particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=112*dt;p.life-=dt;if(p.life<=0)state.particles.splice(i,1);}
    if(now>state.toastUntil) hideToast();
    drawScene();
    requestAnimationFrame(tick);
  }

  function onResize() {
    const rect=canvas.getBoundingClientRect();
    const newW=Math.max(1,rect.width), newH=Math.max(1,rect.height), oldW=state.width, oldBase=state.baseWidth || baseWidthFor(newW);
    const newBase=baseWidthFor(newW), factor=oldW>0 ? newBase/Math.max(1,oldBase) : 1;
    if(oldW>0 && state.stack.length){
      state.stack.forEach(b=>{b.left=newW/2+(b.left-oldW/2)*factor;b.width*=factor;});
      state.mover.left=newW/2+(state.mover.left-oldW/2)*factor;state.mover.width*=factor;
      if(state.drop){state.drop.left=newW/2+(state.drop.left-oldW/2)*factor;state.drop.width*=factor;state.drop.y0=0;}
      state.particles.forEach(p=>{p.x=newW/2+(p.x-oldW/2)*factor;p.y*=newH/Math.max(1,state.height);});
    }
    state.width=newW;state.height=newH;state.baseWidth=newBase;state.baleH=baleHeightFor(newBase);
    const dpr=Math.min(2.5,window.devicePixelRatio||1);
    canvas.width=Math.round(newW*dpr);canvas.height=Math.round(newH*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    if(!state.stack.length){state.mover.width=newBase;}
    if(state.stack.length && state.phase==='playing'){
      state.mover.left=clamp(state.mover.left,8,state.width-state.mover.width-8);
    }
  }

  function renderNotebook() {
    const list=$('noteList'); list.replaceChildren();
    const unlockedNotes=notes.filter(n=>unlocked.has(n.id));
    unlockedNotes.forEach((note,i)=>{
      const entry=document.createElement('article');entry.className='note-entry';
      const num=document.createElement('div');num.className='note-number';num.textContent=String(i+1).padStart(2,'0');
      const body=document.createElement('div');const h=document.createElement('h3');h.textContent=note.title;const p=document.createElement('p');p.textContent=note.body;body.append(h,p);
      if(note.source){const src=document.createElement('span');src.className='note-source';src.textContent='Source: '+note.source;if(note.url){src.textContent='Source: ';const a=document.createElement('a');a.href=note.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=note.source;src.append(a);}body.append(src);}
      entry.append(num,body);list.append(entry);
    });
    if(!unlockedNotes.length){list.textContent='Your first field note will appear after you start playing.';}
  }
  function openNotebook() {
    if(state.phase==='playing')state.phase='paused';
    renderNotebook();$('notesOverlay').hidden=false;$('closeNotes').focus();
  }
  function closeNotebook() {
    $('notesOverlay').hidden=true;
    if(state.phase==='paused')state.phase='playing';
    canvas.focus({preventScroll:true});
  }

  function challengeUrl() {
    try {
      const u=new URL(window.location.href);
      u.searchParams.delete('seed');u.searchParams.delete('daily');
      if(state.mode==='daily')u.searchParams.set('daily',state.dailyDate||utcToday());
      else u.searchParams.set('seed',state.challengeSeed || 'shared-field');
      return u.toString();
    } catch (_) { return window.location.href; }
  }
  function resultText() {
    return `One More Stack · ${state.finalScore} ${state.finalScore===1?'course':'courses'}\n${challengeUrl()}`;
  }
  function makePostcardCanvas() {

    const postcardSky=c.createLinearGradient(0,0,0,900);
    postcardSky.addColorStop(0,'#dfe8e1');postcardSky.addColorStop(.22,'#e8ede4');
    postcardSky.addColorStop(.41,'#efeee1');postcardSky.addColorStop(.58,'#f3ecdc');
    postcardSky.addColorStop(.78,'#e6e7d7');postcardSky.addColorStop(1,'#dce4d4');
    c.fillStyle=postcardSky;c.fillRect(0,0,1200,900);
    const postcardGlow=c.createRadialGradient(975,160,0,975,160,670);
    postcardGlow.addColorStop(0,'rgba(255,237,190,.48)');postcardGlow.addColorStop(.22,'rgba(255,241,207,.27)');
    postcardGlow.addColorStop(.56,'rgba(255,246,224,.10)');postcardGlow.addColorStop(1,'rgba(255,246,224,0)');
    c.fillStyle=postcardGlow;c.fillRect(0,0,1200,720);

    c.fillStyle=postcardOrb;c.beginPath();c.arc(975,160,39,0,Math.PI*2);c.fill();

    c.fillStyle='#d2ded6';c.beginPath();c.moveTo(0,621);
    c.bezierCurveTo(42,588,94,481,174,472);c.bezierCurveTo(217,469,241,506,272,533);
    c.bezierCurveTo(302,556,338,566,374,567);c.bezierCurveTo(415,550,445,502,481,490);
    c.bezierCurveTo(510,490,535,541,571,562);c.bezierCurveTo(638,585,694,558,750,549);
    c.bezierCurveTo(812,536,846,488,896,473);c.bezierCurveTo(932,475,956,511,988,535);
    c.bezierCurveTo(1030,555,1078,569,1200,530);c.lineTo(1200,900);c.lineTo(0,900);c.closePath();c.fill();
    c.save();c.strokeStyle='rgba(91,119,109,.18)';c.lineWidth=1.1;c.lineCap='round';c.beginPath();
    c.moveTo(60,568);c.quadraticCurveTo(123,494,177,486);c.quadraticCurveTo(215,494,248,535);
    c.moveTo(691,550);c.quadraticCurveTo(797,482,895,487);c.quadraticCurveTo(944,494,983,541);c.stroke();c.restore();
    const postcardVeil=c.createLinearGradient(0,438,0,693);
    postcardVeil.addColorStop(0,'rgba(247,242,225,.02)');postcardVeil.addColorStop(.35,'rgba(247,242,225,.30)');
    postcardVeil.addColorStop(.72,'rgba(247,242,225,.14)');postcardVeil.addColorStop(1,'rgba(247,242,225,0)');
    c.fillStyle=postcardVeil;c.fillRect(0,432,1200,270);
    c.fillStyle='#b3c8b9';c.beginPath();c.moveTo(0,650);c.bezierCurveTo(145,600,277,625,393,652);c.bezierCurveTo(533,687,660,641,791,620);c.bezierCurveTo(935,590,1065,631,1200,594);c.lineTo(1200,900);c.lineTo(0,900);c.closePath();c.fill();
    c.save();c.globalAlpha=.68;c.beginPath();c.moveTo(310,648);c.bezierCurveTo(395,628,442,641,500,655);c.bezierCurveTo(574,673,640,631,744,642);c.lineTo(744,667);c.bezierCurveTo(640,657,574,695,500,675);c.bezierCurveTo(442,661,395,654,310,670);c.closePath();c.fillStyle='#aecac2';c.fill();c.restore();
    c.fillStyle='#9fb89e';c.beginPath();c.moveTo(0,683);
    c.bezierCurveTo(170,647,300,683,436,693);c.bezierCurveTo(626,715,792,653,939,672);
    c.quadraticCurveTo(1080,685,1200,656);c.lineTo(1200,900);c.lineTo(0,900);c.closePath();c.fill();
    const postcardMeadow=c.createLinearGradient(0,628,0,900);
    postcardMeadow.addColorStop(0,'#a7ba98');postcardMeadow.addColorStop(.16,'#91ac86');
    postcardMeadow.addColorStop(.5,'#718c72');postcardMeadow.addColorStop(1,'#5c7866');
    c.save();c.beginPath();c.moveTo(0,630);c.bezierCurveTo(190,614,365,635,590,630);c.bezierCurveTo(815,626,1000,614,1200,631);c.lineTo(1200,900);c.lineTo(0,900);c.closePath();c.fillStyle=postcardMeadow;c.fill();
    const postcardLight=c.createLinearGradient(0,630,0,675);postcardLight.addColorStop(0,'rgba(240,231,184,.25)');postcardLight.addColorStop(.55,'rgba(240,231,184,.06)');postcardLight.addColorStop(1,'rgba(240,231,184,0)');
    c.fillStyle=postcardLight;c.fillRect(0,630,1200,270);c.restore();
    // A pagoda and one bamboo screen make the postcard recognisably part of this garden world.
    drawPagoda(c,132,650,124,.98);drawScholarRock(c,248,653,34,.84);drawBamboo(c,1158,700,174,.64);
    // The mark is a small rick of tied rice-sheaf courses, matching the in-game pieces.
    drawSheafMark(c,72,36,62); 
    c.fillStyle='#39443e';c.textAlign='left';c.font='500 32px Georgia,serif';c.fillText('One More Stack',170,92);
    c.fillStyle='#a65e50';c.font='400 17px \"Songti SC\", \"Noto Serif CJK SC\", serif';c.fillText('再来一垛',170,120);
    if(state.mode==='daily'){c.fillStyle='#7d8577';c.font='400 13px system-ui,sans-serif';c.fillText(state.dailyDate,170,143);}
    c.textAlign='right';c.fillStyle='#39443e';c.font='400 76px Georgia,serif';c.fillText(String(state.finalScore).padStart(3,'0'),1120,112);drawChineseSeal(c,1147,133,34);
    // Tiny field details keep the postcard alive without competing with the stack.
    for(let i=0;i<38;i++){

      c.beginPath();c.moveTo(x,y+5);c.lineTo(x-2,y);c.moveTo(x,y+5);c.lineTo(x+3,y+1);c.stroke();
    }
    const count=state.stack.length, originalH=state.baleH;
    const scale=Math.min(2.45,760/Math.max(1,state.baseWidth),395/Math.max(1,count*originalH));
    const bh=originalH*scale,baseY=695;
    state.stack.forEach((b,i)=>{
      const ww=b.width*scale,left=600+(b.left-state.width/2)*scale;
      drawSheafCourse(c,left,baseY-(i+1)*bh,ww,bh,i,b.quality||BALE_QUALITY,false);

    c.textAlign='left';c.fillStyle='#f3f0e5';c.font='500 18px system-ui,sans-serif';
    c.fillText(`${state.placed} ${state.placed===1?'course':'courses'}`,72,830);
    return out;
  }
  function blobFromCanvas(canvasEl) { return new Promise(resolve=>canvasEl.toBlob(resolve,'image/png')); }
  async function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text);return true; }
    const area=document.createElement('textarea');area.value=text;area.setAttribute('readonly','');area.style.position='fixed';area.style.opacity='0';document.body.append(area);area.select();
    let ok=false;try{ok=document.execCommand('copy');}catch(_){}area.remove();if(!ok)throw new Error('Copy is not available in this browser.');return true;
  }
  async function shareResult() {
    const txt=resultText();const url=challengeUrl();
    try {
      const card=makePostcardCanvas();const blob=await blobFromCanvas(card);
      if(blob && typeof File!=='undefined'){
        const file=new File([blob],'one-more-stack.png',{type:'image/png'});
        if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
          await navigator.share({title:'One More Stack',text:txt,url,files:[file]});showToast('Shared.');return;
        }
      }
      if(navigator.share){await navigator.share({title:'One More Stack',text:txt,url});showToast('Your result was shared.');return;}
      await copyText(txt);showToast('Result and replay link copied.');
    } catch(err) {
      if(err && err.name==='AbortError')return;
      try{await copyText(txt);showToast('Link copied.');}catch(_){showToast('Sharing unavailable.');}
    }
  }
  $('startBtn').addEventListener('click',()=>{
    if (!soundChoiceMade) setSoundEnabled(true);
    const params=new URLSearchParams(location.search);
    const daily=params.get('daily'),seed=params.get('seed');
    if(daily && validDate(daily))beginRun('daily',daily);else if(seed && seed.length<=100)beginRun('seeded',seed);else beginRun('daily',utcToday());
  });
  $('soundBtn').addEventListener('click',()=>{soundChoiceMade=true;setSoundEnabled(!soundOn);});
  reflectSoundState();
  document.addEventListener('visibilitychange',()=>{
    if(!musicTrack || !soundOn) return;
    if(document.hidden) musicTrack.pause();
    else if(state.phase==='playing' || state.phase==='menu') {
      const promise=musicTrack.play();
      if(promise && typeof promise.catch==='function') promise.catch(()=>{});
      fadeMusicTo(0.24,700);
    }
  });
  $('againBtn').addEventListener('click',()=>{
    if(state.mode==='daily')beginRun('daily',state.dailyDate);
    else if(state.mode==='seeded')beginRun('seeded',state.challengeSeed);
    else beginRun('practice');
  });
  $('shareBtn').addEventListener('click',shareResult);
  $('notesBtn').addEventListener('click',openNotebook);
  $('closeNotes').addEventListener('click',closeNotebook);
  $('notesOverlay').addEventListener('click',e=>{if(e.target===$('notesOverlay'))closeNotebook();});
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape' && !$('notesOverlay').hidden){closeNotebook();return;}
    if(e.key==='Escape' && state.phase==='playing'){state.phase='paused';showToast('Paused. Press Space to carry on.',2);return;}
    if(e.code==='Space'){
      if(!$('notesOverlay').hidden || !$('result').hidden || !$('intro').hidden)return;
      if(state.phase==='paused'){state.phase='playing';return;}
      if(state.phase==='playing'){e.preventDefault();releaseBale();}
    }
  });
  canvas.addEventListener('pointerdown',e=>{if(e.button!==undefined&&e.button!==0)return;if(state.phase==='playing'){e.preventDefault();releaseBale();}});
  canvas.addEventListener('contextmenu',e=>e.preventDefault());


  $('bestValue').textContent=String(best).padStart(3,'0');
  $('notesCount').textContent=String(unlocked.size);
  if ('ResizeObserver' in window) new ResizeObserver(onResize).observe($('stage')); else window.addEventListener('resize',onResize,{passive:true});
  onResize();
  // In an embedded/loaded page, resize once more after fonts and layout settle.
  window.addEventListener('load',onResize,{once:true});
  requestAnimationFrame(tick);
})();
